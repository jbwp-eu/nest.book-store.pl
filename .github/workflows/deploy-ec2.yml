# CD: deploy to EC2 after CI passes on main (or manual workflow_dispatch).
# TYMCZASOWO: auto-deploy wyłączony — instancja AWS zatrzymana. Produkcja: deploy-ovh.yml
# Aby przywrócić auto-deploy: odkomentuj workflow_run + if + checkout ref + RELEASE_SHA poniżej.
# Server bootstrap: deploy/README.md (Etap 2).
# GitHub Secrets: EC2_HOST, EC2_SSH_KEY, VITE_STRIPE_PUBLISHABLE_KEY_TEST_MODE_AWS,
#   VITE_GOOGLE_MAPS_API_KEY (opcjonalnie)
# GitHub Variables: AWS_DEPLOY_BASE_URL (e.g. https://nest.book-store.pl)
name: Deploy to EC2

on:
  # workflow_run:
  #   workflows: [CI]
  #   types: [completed]
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    # if: >
    #   (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
    #   (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      EC2_USER: ubuntu
    steps:
      - uses: actions/checkout@v4
        # with:
        #   ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and prepare release archive
        env:
          DEPLOY_BASE: ${{ vars.AWS_DEPLOY_BASE_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY_TEST_MODE_AWS: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY_TEST_MODE_AWS }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          DEPLOY_BASE="${DEPLOY_BASE:-https://nest.book-store.pl}"
          DEPLOY_BASE="${DEPLOY_BASE%/}"
          RELEASE_DIR="release-${{ github.sha }}"
          # RELEASE_DIR="release-${{ github.event.workflow_run.head_sha || github.sha }}"

          npm ci --prefix backend
          npm ci --prefix frontend
          npm run build --prefix backend

          cd frontend
          VITE_DEPLOY_TARGET=aws \
          VITE_BACKEND_URL_AWS="${DEPLOY_BASE}/api" \
          VITE_STRIPE_CONFIRMPAYMENT_URL_AWS="${DEPLOY_BASE}" \
          VITE_STRIPE_PUBLISHABLE_KEY_TEST_MODE_AWS="${VITE_STRIPE_PUBLISHABLE_KEY_TEST_MODE_AWS}" \
          VITE_GOOGLE_MAPS_API_KEY="${VITE_GOOGLE_MAPS_API_KEY:-}" \
          VITE_ASSET_URL="https://d8gge2z531r61.cloudfront.net" \
          VITE_APP_NAME="BookStore" \
          VITE_LANGUAGE="pl" \
          VITE_TAX="0" \
          npm run build
          cd ..

          mkdir -p "$RELEASE_DIR/backend" "$RELEASE_DIR/frontend" "$RELEASE_DIR/deploy"
          cp backend/package.json backend/package-lock.json "$RELEASE_DIR/backend/"
          cp -r backend/dist "$RELEASE_DIR/backend/"
          cp -r frontend/dist "$RELEASE_DIR/frontend/"
          cp deploy/activate-release.sh "$RELEASE_DIR/deploy/"
          chmod +x "$RELEASE_DIR/deploy/activate-release.sh"

          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          # echo "RELEASE_SHA=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_ENV"

      - name: Rsync to EC2
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: ${{ env.RELEASE_DIR }}/
          remote_path: /var/www/nest-book-store/releases/${{ env.RELEASE_SHA }}/
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ubuntu
          remote_key: ${{ secrets.EC2_SSH_KEY }}

      - name: Activate release and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            bash /var/www/nest-book-store/releases/${{ env.RELEASE_SHA }}/deploy/activate-release.sh ${{ env.RELEASE_SHA }}

      - name: Smoke test (public URL)
        env:
          DEPLOY_BASE_URL: ${{ vars.AWS_DEPLOY_BASE_URL }}
          DEPLOY_ADMIN_PASSWORD: ${{ secrets.DEPLOY_ADMIN_PASSWORD }}
        run: bash deploy/smoke-test.sh
