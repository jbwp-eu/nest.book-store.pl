name: CI

on:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: backend-unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

  frontend-unit:
    name: frontend-unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_DEPLOY_TARGET: ovh
      VITE_BACKEND_URL_TEST_MODE: http://localhost:3004/api
      VITE_STRIPE_PUBLISHABLE_KEY_TEST_MODE_OVH: pk_test_ci
      VITE_STRIPE_CONFIRMPAYMENT_URL_TEST_MODE: http://localhost:5173
      VITE_BACKEND_URL_OVH: http://localhost:3004/api
      VITE_STRIPE_CONFIRMPAYMENT_URL_OVH: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

  backend-e2e:
    name: backend-e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookstore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bookstore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Create backend .env for CI
        run: |
          cat > .env <<'EOF'
          DB_HOST=localhost
          DB_PORT=5432
          DB_USERNAME=postgres
          DB_PASSWORD=postgres
          DB_NAME=bookstore
          JWT_SECRET=ci-jwt-secret-must-be-at-least-32-chars
          DEPLOY_TARGET=ovh
          STRIPE_SECRET_KEY_TEST_MODE_OVH=sk_test_ci_dummy
          STRIPE_WEBHOOK_SECRET_TEST_MODE_OVH=whsec_ci_dummy
          ADMIN_PASSWORD=ci-admin-password
          EOF

      - run: npm ci
      - run: npm run seed -- -i
      - run: npm run test:e2e
